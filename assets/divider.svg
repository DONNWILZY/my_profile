<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="28" viewBox="0 0 1280 28" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="40" y="13" width="1200" height="2" rx="1" fill="url(#line)"/>

  <rect x="634" y="8" width="12" height="12" rx="2" fill="#1D4ED8" stroke="#93C5FD" stroke-width="1.5" transform="rotate(45 640 14)"/>

  <circle r="9" cy="14" fill="#22D3EE" fill-opacity=".25">
    <animate attributeName="cx" values="40;1240" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" cy="14" fill="#22D3EE">
    <animate attributeName="cx" values="40;1240" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
