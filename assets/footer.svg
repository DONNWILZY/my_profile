<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Good technology should make a real difference. Thanks for visiting.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06142F"/>
      <stop offset=".6" stop-color="#1235A8"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="250" rx="26"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="250" fill="url(#bg)"/>

    <!-- waves -->
    <path d="M0 196 Q160 166 320 196 T640 196 T960 196 T1280 196 T1600 196 T1920 196 V250 H0Z" fill="#DBEAFE" fill-opacity=".07">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-640 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0 212 Q160 188 320 212 T640 212 T960 212 T1280 212 T1600 212 T1920 212 V250 H0Z" fill="#93C5FD" fill-opacity=".10">
      <animateTransform attributeName="transform" type="translate" from="-640 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 228 Q160 210 320 228 T640 228 T960 228 T1280 228 T1600 228 T1920 228 V250 H0Z" fill="#06142F" fill-opacity=".35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-640 0" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <rect x="608" y="40" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text class="sans" x="640" y="94" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="800" letter-spacing="-.5">Good technology should make a real difference.</text>
    <text class="sans" x="640" y="130" text-anchor="middle" fill="#DBEAFE" font-size="18">Thanks for visiting — explore a repository or connect through GleegX.</text>

    <rect x="540" y="150" width="200" height="34" rx="17" fill="#0A1F44" fill-opacity=".5" stroke="#93C5FD" stroke-opacity=".5"/>
    <circle cx="566" cy="167" r="4.5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="584" y="172" fill="#EFF6FF" font-size="14" font-weight="700" letter-spacing=".5">www.gleegx.com</text>
  </g>
</svg>
